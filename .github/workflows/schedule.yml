name: 📅 Daily Briefing (Morning & Evening)

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST (Morning Briefing)
    - cron: '30 1 * * *'
    # 14:30 UTC = 08:00 PM IST (Evening Homework Reminder)
    - cron: '30 14 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Mobile/Web

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Email Notifier
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python notifier_email.py
